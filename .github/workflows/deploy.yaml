

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/spiritans

            echo "── Resetting to match remote ──"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "── Installing dependencies ──"
            CI=true /usr/local/bin/pnpm install --no-frozen-lockfile

            echo "── Clearing dev schema-push marker (prevents interactive migrate prompt) ──"
            /usr/local/bin/pnpm db:clear-dev-marker || true

            echo "── Running migrations ──"
            /usr/local/bin/pnpm payload migrate

            echo "── Building ──"
            free -h

            # The Next.js type checker runs in a worker that needs ~1 GB. On a
            # small VPS the running app competes for that memory and the worker
            # is killed, which shows up as a bare exit 1 after
            # "Running TypeScript ...". Stop the app for the build to free its
            # memory and to avoid serving from a .next that is being replaced.
            /usr/local/bin/pm2 stop spiritans || true
            trap '/usr/local/bin/pm2 delete spiritans >/dev/null 2>&1 || true; /usr/local/bin/pm2 start ecosystem.config.cjs --env production || true' EXIT

            # Add swap headroom when the server has none (non-fatal if it is
            # already configured or cannot be created).
            if [ "$(free -m | awk '/^Swap:/ {print $2}')" -eq 0 ] && [ ! -e /swapfile ]; then
              echo "No swap detected; creating a 2G swapfile for build headroom..."
              if fallocate -l 2G /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none 2>/dev/null; then
                chmod 600 /swapfile
                if mkswap /swapfile >/dev/null 2>&1 && swapon /swapfile 2>/dev/null; then
                  grep -q '^/swapfile ' /etc/fstab 2>/dev/null || echo '/swapfile none swap sw 0 0' >> /etc/fstab
                  free -h
                else
                  rm -f /swapfile
                fi
              fi
            fi

            rm -rf .next
            # Merge stderr into stdout on failure so TypeScript diagnostics are
            # visible in the deploy log instead of only the hidden `err:` stream.
            if ! /usr/local/bin/pnpm build > /tmp/spiritans-build.log 2>&1; then
              echo "── Build failed ──"
              cat /tmp/spiritans-build.log
              exit 1
            fi
            cat /tmp/spiritans-build.log

            echo "── Restarting app ──"
            /usr/local/bin/pm2 delete spiritans || true
            /usr/local/bin/pm2 start ecosystem.config.cjs --env production
            trap - EXIT

            echo "── Done ──"
            /usr/local/bin/pm2 status
